pluginManagement {
    repositories {
        maven { url = "https://architectury.dev" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://neoforged.net" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
}

rootProject.name = 'Kairosplit'

include("common")
include("fabric")
include("neoforge")
